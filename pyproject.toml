[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsintel"
version = "0.1.0"
description = "DCS World mission generator: random and training .miz files (SEAD, CAP, strike, CAS, intercept, escort, dogfight). AI agent skill + dcsintel CLI, built on pydcs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DCSActualIntel contributors" }]
keywords = [
    "dcs",
    "dcs-world",
    "dcs-world-mission",
    "mission-generator",
    "flight-sim",
    "flight-simulator",
    "combat-flight-simulator",
    "miz",
    "sead",
    "cap",
    "cas",
    "intercept",
    "pydcs",
    "training-mission",
    "f-16",
    "ai-agent",
    "cursor",
]

dependencies = [
    # PyPI pydcs 0.15.0 crashes on import under Python 3.13 (PEP 667 changed
    # exec()/locals() semantics, breaking its livery scanner). Master has a
    # rewritten scanner, so we pin a known-good commit.
    "pydcs @ git+https://github.com/pydcs/dcs.git@075949ea280f02fd63ec20187ff76747aae7d4e9",
]

[project.scripts]
dcsintel = "dcsintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dcsintel = ["data/*.json", "data/curricula.json"]
